<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Site oficial de Lucas Calzoni com apresentação, trabalhos, galeria de fotos, reel e canais de contato profissional."
    />
    <link rel="canonical" href="https://lucas-calzoni.vercel.app/" />
    <title>Lucas Calzoni</title>

    <!-- Open Graph — dados de compartilhamento (Etapa 11). Título/descrição
         reaproveitam o mesmo conteúdo de `<title>`/`meta description` acima,
         nunca um texto novo inventado. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lucas-calzoni.vercel.app/" />
    <meta property="og:title" content="Lucas Calzoni" />
    <meta
      property="og:description"
      content="Site oficial de Lucas Calzoni com apresentação, trabalhos, galeria de fotos, reel e canais de contato profissional."
    />
    <meta property="og:image" content="https://lucas-calzoni.vercel.app/assets/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lucas Calzoni" />
    <meta
      name="twitter:description"
      content="Site oficial de Lucas Calzoni com apresentação, trabalhos, galeria de fotos, reel e canais de contato profissional."
    />
    <meta name="twitter:image" content="https://lucas-calzoni.vercel.app/assets/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
